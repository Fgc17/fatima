[workspace]
members = ["packages/cli", "packages/core"]
default-members = ["packages/cli"]
resolver = "2"

[workspace.package]
version = "1.0.1-rc.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Fgc17/fatima"

[workspace.dependencies]
fatima-core = { path = "packages/core" }
clap = { version = "4.6.1", features = ["derive", "env", "wrap_help"] }
aes-gcm = "0.10"
base64 = "0.22"
indicatif = { version = "0.18.4", default-features = false, features = ["unicode-width"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "fuzzy"] }
miette = { version = "7.6", features = ["fancy-no-backtrace"] }
rand = "0.8"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
crossterm = "0.29"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3
