name: Patch static files

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to patch, e.g. v1.2.3"
        required: true
        type: string
      source_ref:
        description: "Commit SHA, branch, or tag containing patched static files"
        required: true
        type: string

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ inputs.tag }}

jobs:
  patch-static:
    name: Patch static files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Patch static files in R2
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          BUCKET="${{ secrets.R2_BUCKET }}"
          ENDPOINT="${{ secrets.R2_ENDPOINT }}"

          if [[ "$TAG" != v* ]]; then
            echo "tag must start with v, got: $TAG" >&2
            exit 1
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG does not exist" >&2
            exit 1
          fi

          test -f static/install.sh
          test -f static/schema.json

          put_object() {
            local key="$1"
            local file="$2"
            local content_type="$3"

            echo "Uploading $file to $key"
            aws s3api put-object \
              --bucket "$BUCKET" \
              --key "$key" \
              --body "$file" \
              --content-type "$content_type" \
              --endpoint-url "$ENDPOINT"
          }

          put_object "install/v$VERSION/install.sh" static/install.sh "text/x-shellscript; charset=utf-8"
          put_object "schema/v$VERSION/schema.json" static/schema.json "application/schema+json"

          LATEST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"

          if [[ "$TAG" == "$LATEST_TAG" ]]; then
            echo "$TAG is latest release; patching aliases"

            put_object "install" static/install.sh "text/x-shellscript; charset=utf-8"
            put_object "install.sh" static/install.sh "text/x-shellscript; charset=utf-8"
            put_object "install/latest" static/install.sh "text/x-shellscript; charset=utf-8"
            put_object "install/latest/install.sh" static/install.sh "text/x-shellscript; charset=utf-8"

            put_object "schema.json" static/schema.json "application/schema+json"
            put_object "schema/latest/schema.json" static/schema.json "application/schema+json"
          else
            echo "$TAG is not latest release ($LATEST_TAG); leaving aliases unchanged"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.R2_REGION || 'auto' }}
