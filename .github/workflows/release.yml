name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the leading v"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: prepare

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'packages/*/package.json') }}-prepare-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'packages/*/package.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release versions
        run: pnpm run verify:release -- --version ${{ steps.version.outputs.version }}

      - name: Check TypeScript
        run: pnpm run checktypes

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Package Rust crates
        run: cargo package -p fatima-core

  publish-crates:
    name: Publish crates.io
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish fatima-core
        run: cargo publish -p fatima-core --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish fatima-cli
        run: cargo publish -p fatima-cli --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64-musl
            runner: ubuntu-latest
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-13
          - target: darwin-arm64
            runner: macos-14
          - target: windows-x64
            runner: windows-latest
            msvc_arch: x64
          - target: windows-arm64
            runner: windows-latest
            msvc_arch: amd64_arm64
          - target: wasm
            runner: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
          cache-on-failure: true

      - name: Restore Docker build dependencies
        id: cache-docker-build
        if: runner.os == 'Linux' && (matrix.target == 'linux-x64-musl' || matrix.target == 'linux-arm64-musl' || startsWith(matrix.target, 'darwin-'))
        uses: actions/cache/restore@v4
        with:
          path: target/fatima-build-cache
          key: ${{ runner.os }}-docker-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-docker-build-${{ matrix.target }}-
            ${{ runner.os }}-docker-build-

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Setup wasm-pack
        if: matrix.target == 'wasm'
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build binary archive
        run: cargo run -p task -- build-binaries --target ${{ matrix.target }}

      - name: Save Docker build dependencies
        if: always() && runner.os == 'Linux' && (matrix.target == 'linux-x64-musl' || matrix.target == 'linux-arm64-musl' || startsWith(matrix.target, 'darwin-')) && steps.cache-docker-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/fatima-build-cache
          key: ${{ steps.cache-docker-build.outputs.cache-primary-key }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatima-${{ matrix.target }}
          path: |
            .release/*.zip
            .release/*.tar.gz
          if-no-files-found: error

      - name: Upload WASM npm artifact
        if: matrix.target == 'wasm'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-npm
          path: |
            .release/raw/wasm-pack/fatima_wasm.js
            .release/raw/wasm-pack/fatima_wasm.d.ts
            .release/raw/wasm/fatima_wasm_bg.wasm
          if-no-files-found: error

  publish-npm:
    name: Publish npm
    needs:
      - prepare
      - build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'packages/*/package.json') }}-publish-npm-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'packages/*/package.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download WASM build artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-npm
          path: .release/raw

      - name: Publish @fatima.dev/js
        run: pnpm run publish:npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  github-release:
    name: Publish GitHub release
    needs:
      - prepare
      - build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fatima-*
          path: .release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .release-assets/* --clobber
          else
            gh release create "$TAG" .release-assets/* --title "Fatima v$VERSION" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-static:
    name: Upload static files
    needs:
      - prepare
      - github-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Upload static files to Cloudflare CDN
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            r2 object put ${{ secrets.CLOUDFLARE_R2_BUCKET }}/install --file static/install.sh
            r2 object put ${{ secrets.CLOUDFLARE_R2_BUCKET }}/install.sh --file static/install.sh
            r2 object put ${{ secrets.CLOUDFLARE_R2_BUCKET }}/install/latest --file static/install.sh
            r2 object put ${{ secrets.CLOUDFLARE_R2_BUCKET }}/install/latest/install.sh --file static/install.sh
            r2 object put ${{ secrets.CLOUDFLARE_R2_BUCKET }}/install/v${{ needs.prepare.outputs.version }}/install.sh --file static/install.sh
            r2 object put ${{ secrets.CLOUDFLARE_R2_BUCKET }}/schema.json --file static/schema.json
            r2 object put ${{ secrets.CLOUDFLARE_R2_BUCKET }}/schema/latest/schema.json --file static/schema.json
            r2 object put ${{ secrets.CLOUDFLARE_R2_BUCKET }}/schema/v${{ needs.prepare.outputs.version }}/schema.json --file static/schema.json
